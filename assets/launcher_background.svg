<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
<!-- The launcher's backdrop (src/main/main.cpp): a golf course on a sunny day, drawn for the project from plain shapes,
     as the icon is. A pale glow behind the launcher's blue title (a quarter of the way down) and a soft dark patch behind
     its white menu (below the middle) keep the text legible; 16:9, which the launcher crops to the window's shape. -->
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#5fb2ee"/><stop offset="0.4" stop-color="#9fd8f7"/><stop offset="0.65" stop-color="#def4fd"/>
</linearGradient>
<linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc29a"/><stop offset="1" stop-color="#5aa97a"/></linearGradient>
<linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cbf4f"/><stop offset="1" stop-color="#3f9d3c"/></linearGradient>
<linearGradient id="fairway" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd65a"/><stop offset="1" stop-color="#3f9a34"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6eb6e"/><stop offset="1" stop-color="#78cf52"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fc4ee"/><stop offset="1" stop-color="#2f8fd0"/></linearGradient>
<radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fffbe0"/><stop offset="0.35" stop-color="#fff2a0"/><stop offset="1" stop-color="#fff2a0" stop-opacity="0"/></radialGradient>
<radialGradient id="lift" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<radialGradient id="shade" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0b2a1c" stop-opacity="0.6"/><stop offset="0.6" stop-color="#0b2a1c" stop-opacity="0.45"/><stop offset="1" stop-color="#0b2a1c" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1920" height="1080" fill="url(#sky)"/>
<circle cx="1620" cy="190" r="190" fill="url(#sun)"/>
<circle cx="1620" cy="190" r="62" fill="#fff6c4"/>
<g fill="#ffffff">
<g opacity="0.95"><ellipse cx="300" cy="200" rx="120" ry="40"/><circle cx="250" cy="180" r="48"/><circle cx="330" cy="165" r="62"/><circle cx="395" cy="195" r="40"/></g>
<g opacity="0.85"><ellipse cx="1180" cy="120" rx="100" ry="32"/><circle cx="1140" cy="104" r="38"/><circle cx="1205" cy="92" r="50"/></g>
<g opacity="0.8"><ellipse cx="1750" cy="430" rx="110" ry="30"/><circle cx="1710" cy="414" r="36"/><circle cx="1770" cy="400" r="46"/></g>
<g opacity="0.8"><ellipse cx="120" cy="470" rx="100" ry="28"/><circle cx="90" cy="452" r="34"/><circle cx="150" cy="444" r="40"/></g>
