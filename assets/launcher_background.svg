<ellipse cx="560" cy="1006" rx="26" ry="7" fill="#000" opacity="0.3"/>
<circle cx="556" cy="990" r="17" fill="#eef1f4"/>
<rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
