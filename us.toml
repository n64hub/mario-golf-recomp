# N64Recomp's configuration for Mario Golf (USA), NMFE rev 0: it reads the game's code out of the ROM by the symbols in
# syms/ and writes RecompiledFuncs/ (tools/recompile.sh). All the code is stored raw in the ROM, so there is nothing to
# decompress first.
[input]
# The ROM header's entrypoint, the decomp's _start (src/entry/entry.s).
entrypoint = 0x80025C00
# Paths are relative to this file.
symbols_file_path = "syms/mariogolf64.us.syms.toml"
rom_file_path = "roms/mariogolf64.us.z64"
output_func_path = "RecompiledFuncs"
use_absolute_symbols = true

[patches]
# The game's own functions named as C's math functions and main, which the generated C would declare a second time
# with the recompiled functions' signature: N64Recomp gives these a _recomp suffix.
renamed = ["sin", "cos", "tan", "atan", "atan2", "main"]


# The game copies its overlays out of ROM with nuPiReadRom (the decomp's src/libnusys/nupireadrom.c), from its overlay
# table (ROM 0x91360, 0x28 bytes an overlay: ROM start and end, then RAM start), and the runtime maps the functions in
# the stretch it copies at the RAM it copies them to (mg_load_overlays). Its other reads (assets, sound) map nothing.
[[patches.hook]]
func = "nuPiReadRom"
before_vram = 0x80025C50
text = "{ void mg_load_overlays(uint8_t*, uint32_t, uint32_t, uint32_t); mg_load_overlays(rdram, ctx->r4, ctx->r5, ctx->r6); }"

# The idle thread (NuSystem's nuIdle, func_8009951C after it starts the main thread) loops calling nuIdleFunc while it
# is set, and spins while it isn't, which the game never sets. Only one game thread runs at a time here, so the spin
# would keep every other from running: each pass waits for the runtime's next message (a retrace, a task done) and
# lets the threads it wakes run.
[[patches.hook]]
func = "func_8009951C"
before_vram = 0x800995B0
text = "{ void yield_self(uint8_t*); yield_self(rdram); }"

# The main thread's wait for a game mode (func_80029C34 after it sets the graphics callback, func_8002A434): it spins
# while the mode word at 0x801052CC is -1, which only that callback changes, on the graphics thread at a retrace. Each
# pass yields, so that the other game threads run.
[[patches.hook]]
func = "func_80029C34"
before_vram = 0x80029EB4
text = "{ void yield_self(uint8_t*); yield_self(rdram); }"

# NuSystem's wait for every graphics task to end (the decomp's src/libnusys/nugfxtaskallendwait.c) spins on
# nuGfxTaskSpool, which its task manager thread counts down as each task ends: while tasks are pending each pass lets
# that thread run.
[[patches.hook]]
func = "nuGfxTaskAllEndWait"
before_vram = 0x800A1608
text = "{ void yield_self(uint8_t*); if (ctx->r2 != 0) yield_self(rdram); }"

# A wait of three retraces in func_80069D08 (Training's course screen, as the hole changes): it spins while the
# retrace count at 0x800B67F0, which the graphics callback advances on another game thread, is within 3 of the one it
# noted at 0x80105318. Each pass yields, so that thread runs; without it the game froze there.
[[patches.hook]]
func = "func_80069D08"
before_vram = 0x80069D5C
text = "{ void yield_self(uint8_t*); yield_self(rdram); }"

# The main loop's call of address 0 (a debug library's function the release doesn't link), with a0 = 100, made only
# while the byte at 0x800B67C8 is 2. Nothing sets it but the graphics callback, from 1 to 2 when A, B, L and R are held,
# and nothing sets it to 1, so the call never runs; N64Recomp needs a function to call there, and it calls nothing.
[[patches.instruction]]
func = "func_80029C34"
vram = 0x80029EAC
value = 0x00000000

# The course's HUD at the wide picture's sides (src/game/hud.cpp): around the frame's one call of the function that
# draws it (func_80089094), what it adds to the display list is noted and put back with RT64's alignments.
[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x80030950
text = "{ void mg_hud_begin(uint8_t*); mg_hud_begin(rdram); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x80030958
text = "{ void mg_hud_end(uint8_t*); mg_hud_end(rdram); }"

# The sun's light on the sky past the 4:3 frame's sides (src/game/backdrop.cpp): around both of the frame's calls of the
# function that draws the sky (func_80091110), a rectangle it cuts at a side of the screen is put back past it.
[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x8002F8F8
text = "{ void mg_backdrop_begin(uint8_t*); mg_backdrop_begin(rdram); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x8002F900
text = "{ void mg_backdrop_end(uint8_t*); mg_backdrop_end(rdram); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x8002FE5C
text = "{ void mg_backdrop_begin(uint8_t*); mg_backdrop_begin(rdram); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x8002FE64
text = "{ void mg_backdrop_end(uint8_t*); mg_backdrop_end(rdram); }"

# The sun's light drawn while any of it is in the wide picture (src/game/backdrop.cpp): func_8008FF20 draws it only
# while the sun is within 64 pixels of the 4:3 screen, so its bounds read the sun's x moved toward the middle.
[[patches.hook]]
func = "func_8008FF20"
before_vram = 0x80090658
text = "{ float mg_sun_bound_x(float); ctx->f2.fl = mg_sun_bound_x(ctx->f2.fl); }"

# The ball and the stars around the cup past the 4:3 frame's sides (src/game/ball.cpp): around both of the frame's calls
# of the function that draws the ball's sprites up close (func_ovl0_801FE370), and its call of the one that draws the
# stars (func_ovl0_80217164), a rectangle at or past a side of the screen is put back past it.
[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x80030280
text = "{ void mg_ball_begin(uint8_t*); mg_ball_begin(rdram); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x80030288
text = "{ void mg_ball_end(uint8_t*); mg_ball_end(rdram); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x800303D4
text = "{ void mg_ball_begin(uint8_t*); mg_ball_begin(rdram); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x800303DC
text = "{ void mg_ball_end(uint8_t*); mg_ball_end(rdram); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x80030750
text = "{ void mg_ball_begin(uint8_t*); mg_ball_begin(rdram); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x80030758
text = "{ void mg_ball_end(uint8_t*); mg_ball_end(rdram); }"

# The title screen's painting at the picture's full height in a wide window (src/game/title.cpp): each display list the
# game sends is read for the painting's scissor, and its rectangles are scaled in place. And the iris wipe at its own
# shape (src/game/iris.cpp): the same list is read for the mask's rectangle, which is drawn at its aspect across the
# whole window.
[[patches.hook]]
func = "nuGfxTaskStart"
before_vram = 0x80029774
text = "{ void mg_title_fill(uint8_t*, uint32_t); void mg_iris_fix(uint8_t*, uint32_t); mg_title_fill(rdram, (uint32_t)ctx->r4); mg_iris_fix(rdram, (uint32_t)ctx->r4); }"

# The course's terrain without cracks at a high resolution. The course is 8 by 16 blocks, and each frame func_80062A8C
# picks each block's level of detail by its distance: 2, its own fine display list; 1, a 2x2 grid of quads; 0, one quad.
# Where levels meet the game stitches most edges (a fine block's edge pieces suit a coarser neighbour, a level-1 group
# averages its edge midpoints beside a level-0 one), but not all: a level-1 block in a group of four that also holds a
# level-2 one keeps its edges' true midpoints beside a level-0 group above or below it. The terrain bends at those
# midpoints and the level-0 edge doesn't, so a sliver of the background shows between them: on a console a fraction of
# a pixel, at 4K a pale line across the rough wherever a hill's height there is far off the straight edge. Here a block
# the game would draw at level 0 is drawn at level 1 (the branch's delay slot sets 1 in place of 0), so level 0 is
# never drawn and every edge left meets one the game stitches; far terrain draws 8 triangles a block in place of 2.
[[patches.instruction]]
func = "func_80062A8C"
vram = 0x800633A8
value = 0x24050001

# The old shot of a transition at 4:3 in a wide picture (src/game/card.cpp): around the transition drawer's
# (func_800957F0) call of the function that draws the game's copy of its last frame as strips (func_8009232C), RT64
# keeps rectangles at their shape rather than stretching those that span the screen.
[[patches.hook]]
func = "func_800957F0"
before_vram = 0x80095870
text = "{ void mg_card_strips_begin(uint8_t*); mg_card_strips_begin(rdram); }"

[[patches.hook]]
func = "func_800957F0"
before_vram = 0x80095878
text = "{ void mg_card_strips_end(uint8_t*); mg_card_strips_end(rdram); }"
