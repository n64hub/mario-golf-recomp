# The course's trees and Bomb-ombs paired between the game's frames only with billboards of their own size
# (src/game/billboard.cpp): in each display list the game sends, each billboard is put in a matrix group of its scale's,
# and each letter of the big words a hole or a shot ends on (HOLE-IN-ONE!, NICE SHOT!) in one of its own
# (src/game/callout.cpp), so RT64 blends each letter with itself between the game's frames.
# The iris wipe at its own shape (src/game/iris.cpp): the same list is read for the mask's rectangle, which is drawn
# at its aspect across the whole window. Then the course and the opening to the window's edges (src/game/border.cpp):
# on a hole and in the opening the game's border scissor is made the screen's, and the rectangles as wide as the 3D
# reach its sides. Then the title and the menus at the picture's full height in a wide window (src/game/screen.cpp): on
# those screens the same list's rectangles, scissors and viewports are scaled, all but the iris's, which is why it goes
# before.
[[patches.hook]]
func = "nuGfxTaskStart"
before_vram = 0x80029774
text = "{ void mg_billboards(uint8_t*, uint32_t); void mg_callouts(uint8_t*, uint32_t); void mg_iris_fix(uint8_t*, uint32_t); void mg_border_fill(uint8_t*, uint32_t); void mg_screen_fill(uint8_t*, uint32_t); mg_billboards(rdram, (uint32_t)ctx->r4); mg_callouts(rdram, (uint32_t)ctx->r4); mg_iris_fix(rdram, (uint32_t)ctx->r4); mg_border_fill(rdram, (uint32_t)ctx->r4); mg_screen_fill(rdram, (uint32_t)ctx->r4); }"

# The course's terrain without cracks at a high resolution. The course is 8 by 16 blocks, and each frame func_80062A8C
# picks each block's level of detail by its distance: 2, its own fine display list; 1, a 2x2 grid of quads; 0, one quad.
# Where levels meet the game stitches most edges (a fine block's edge pieces suit a coarser neighbour, a level-1 group
# averages its edge midpoints beside a level-0 one), but not all: a level-1 block in a group of four that also holds a
# level-2 one keeps its edges' true midpoints beside a level-0 group above or below it. The terrain bends at those
# midpoints and the level-0 edge doesn't, so a sliver of the background shows between them: on a console a fraction of
# a pixel, at 4K a pale line across the rough wherever a hill's height there is far off the straight edge. Here a block
# the game would draw at level 0 is drawn at level 1 (the branch's delay slot sets 1 in place of 0), so level 0 is
# never drawn and every edge left meets one the game stitches; far terrain draws 8 triangles a block in place of 2.
[[patches.instruction]]
func = "func_80062A8C"
vram = 0x800633A8
value = 0x24050001

# The old shot of a transition over the wide picture's whole width (src/game/card.cpp): before the transition drawer
