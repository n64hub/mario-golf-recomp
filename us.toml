# The Game Boy Color's golfers (Kid, Sherry, Azalea and Joe) at character select, with the General tab's Game Boy
# Golfers option (src/game/config.cpp). On a console they come only through a Transfer Pak holding Mario Golf for the
# Game Boy Color: overlay 15's link reads the golfers the cart holds into RAM for the session (0x800FF1E8, 0x8C bytes
# each, never the N64 save), and func_8005CA48 puts each into character select's grid, with its name and its driver's
# stats from the clubs table. The game has the four of its own, names and driver stats in its data (0x800C2B40-
# 0x800C2B60: drives of 500, 400, 300 and 200 yards, test values by the look of them), which func_8005CA48 puts in
# instead while debug flag 0x54 is on (func_800299F4's test), writing those stats over each one's driver. The flag's
# other reader, func_8005C674, sets the grid's every other golfer unlocked, so the flag itself isn't set: after each
# of func_8005CA48's three tests of it, the answer is on unless the option is Original. The first, before anything is
# written, also sets the stats that path writes to the second option's, Game Boy Golfers' Stats: the clubs table's own
# (Normal) or the test values (Test). At its end, the four's clubs are worked out as the link works out a golfer's
# (mg_gb_golfers_clubs), or none of their shots goes anywhere.
[[patches.hook]]
func = "func_8005CA48"
before_vram = 0x8005CBD8
text = "{ int mg_gb_golfers_setup(uint8_t*); if (mg_gb_golfers_setup(rdram)) ctx->r2 = 1; }"

[[patches.hook]]
func = "func_8005CA48"
before_vram = 0x8005CC1C
text = "{ int mg_gb_golfers(void); if (mg_gb_golfers()) ctx->r2 = 1; }"

[[patches.hook]]
func = "func_8005CA48"
before_vram = 0x8005CD18
text = "{ int mg_gb_golfers(void); if (mg_gb_golfers()) ctx->r2 = 1; }"

[[patches.hook]]
func = "func_8005CA48"
before_vram = 0x8005CEBC
text = "{ void mg_gb_golfers_clubs(uint8_t*, recomp_context*); mg_gb_golfers_clubs(rdram, ctx); }"

# The courses' ambience (src/game/sound.cpp): every 240 game frames on a hole, func_ovl0_802078F4 plays one of its
