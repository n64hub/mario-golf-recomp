# before and the strips rewritten to read it.
[[patches.hook]]
func = "func_800957F0"
before_vram = 0x800957F8
text = "{ void mg_card_check(uint8_t*); mg_card_check(rdram); }"

[[patches.hook]]
func = "func_800957F0"
before_vram = 0x80095870
text = "{ void mg_card_strips_begin(uint8_t*); mg_card_strips_begin(rdram); }"

[[patches.hook]]
func = "func_800957F0"
before_vram = 0x80095878
text = "{ void mg_card_strips_end(uint8_t*); mg_card_strips_end(rdram); }"

