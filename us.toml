# The aim's marks where their points are, not the whole pixel func_80065650 cuts them to (src/game/aim.cpp): in
# func_ovl0_8021C6B4, just after it works out the landing point (its label) and the pin (the flag in the sky), and where
# each one's drawing ends, the texture rectangles drawn between are moved across by what was dropped of the point's x.
[[patches.hook]]
