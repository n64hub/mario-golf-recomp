# N64Recomp's configuration for Mario Golf (USA), NMFE rev 0: it reads the game's code out of the ROM by the symbols in
# syms/ and writes RecompiledFuncs/ (tools/recompile.sh). All the code is stored raw in the ROM, so there is nothing to
# decompress first.
[input]
# The ROM header's entrypoint, the decomp's _start (src/entry/entry.s).
entrypoint = 0x80025C00
# Paths are relative to this file.
symbols_file_path = "syms/mariogolf64.us.syms.toml"
rom_file_path = "roms/mariogolf64.us.z64"
output_func_path = "RecompiledFuncs"
use_absolute_symbols = true

[patches]
# The game's own functions named as C's math functions and main, which the generated C would declare a second time
# with the recompiled functions' signature: N64Recomp gives these a _recomp suffix.
renamed = ["sin", "cos", "tan", "atan", "atan2", "main"]


# The game copies its overlays out of ROM with nuPiReadRom (the decomp's src/libnusys/nupireadrom.c), from its overlay
# table (ROM 0x91360, 0x28 bytes an overlay: ROM start and end, then RAM start), and the runtime maps the functions in
# the stretch it copies at the RAM it copies them to (mg_load_overlays). Its other reads (assets, sound) map nothing.
[[patches.hook]]
func = "nuPiReadRom"
before_vram = 0x80025C50
text = "{ void mg_load_overlays(uint8_t*, uint32_t, uint32_t, uint32_t); mg_load_overlays(rdram, ctx->r4, ctx->r5, ctx->r6); }"

# The idle thread (NuSystem's nuIdle, func_8009951C after it starts the main thread) loops calling nuIdleFunc while it
# is set, and spins while it isn't, which the game never sets. Only one game thread runs at a time here, so the spin
# would keep every other from running: each pass waits for the runtime's next message (a retrace, a task done) and
# lets the threads it wakes run.
[[patches.hook]]
func = "func_8009951C"
before_vram = 0x800995B0
text = "{ void yield_self(uint8_t*); yield_self(rdram); }"

# The main thread's wait for a game mode (func_80029C34 after it sets the graphics callback, func_8002A434): it spins
# while the mode word at 0x801052CC is -1, which only that callback changes, on the graphics thread at a retrace. Each
# pass yields, so that the other game threads run.
[[patches.hook]]
func = "func_80029C34"
before_vram = 0x80029EB4
text = "{ void yield_self(uint8_t*); yield_self(rdram); }"

# NuSystem's wait for every graphics task to end (the decomp's src/libnusys/nugfxtaskallendwait.c) spins on
# nuGfxTaskSpool, which its task manager thread counts down as each task ends: while tasks are pending each pass lets
# that thread run.
[[patches.hook]]
func = "nuGfxTaskAllEndWait"
before_vram = 0x800A1608
text = "{ void yield_self(uint8_t*); if (ctx->r2 != 0) yield_self(rdram); }"

# A wait of three retraces in func_80069D08 (Training's course screen, as the hole changes): it spins while the
# retrace count at 0x800B67F0, which the graphics callback advances on another game thread, is within 3 of the one it
# noted at 0x80105318. Each pass yields, so that thread runs; without it the game froze there.
[[patches.hook]]
func = "func_80069D08"
before_vram = 0x80069D5C
text = "{ void yield_self(uint8_t*); yield_self(rdram); }"

# The main loop's call of address 0 (a debug library's function the release doesn't link), with a0 = 100, made only
# while the byte at 0x800B67C8 is 2. Nothing sets it but the graphics callback, from 1 to 2 when A, B, L and R are held,
# and nothing sets it to 1, so the call never runs; N64Recomp needs a function to call there, and it calls nothing.
[[patches.instruction]]
func = "func_80029C34"
vram = 0x80029EAC
value = 0x00000000

# The course's HUD at the wide picture's sides (src/game/hud.cpp): around the frame's one call of the function that
# draws it (func_80089094), what it adds to the display list is noted and put back with RT64's alignments.
[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x80030950
text = "{ void mg_hud_begin(uint8_t*); mg_hud_begin(rdram); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x80030958
text = "{ void mg_hud_end(uint8_t*); mg_hud_end(rdram); }"

# The sun's light on the sky past the 4:3 frame's sides (src/game/backdrop.cpp): around both of the frame's calls of the
# function that draws the sky (func_80091110), a rectangle it cuts at a side of the screen is put back past it.
[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x8002F8F8
text = "{ void mg_backdrop_begin(uint8_t*); mg_backdrop_begin(rdram); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x8002F900
text = "{ void mg_backdrop_end(uint8_t*); mg_backdrop_end(rdram); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x8002FE5C
text = "{ void mg_backdrop_begin(uint8_t*); mg_backdrop_begin(rdram); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x8002FE64
text = "{ void mg_backdrop_end(uint8_t*); mg_backdrop_end(rdram); }"

# The sun's light drawn while any of it is in the wide picture (src/game/backdrop.cpp): func_8008FF20 draws it only
# while the sun is within 64 pixels of the 4:3 screen, so its bounds read the sun's x moved toward the middle.
[[patches.hook]]
func = "func_8008FF20"
before_vram = 0x80090658
text = "{ float mg_sun_bound_x(float); ctx->f2.fl = mg_sun_bound_x(ctx->f2.fl); }"

# The golfers' joints blended whole in the frames RT64 draws between the game's (src/game/golfer.cpp): where
# the function that draws a golfer stores the display list's head back, its call of the model's body is wrapped in a
# matrix group of the golfer's own. $v0 is the head, $s2 the model's struct.
[[patches.hook]]
func = "func_80057FFC"
before_vram = 0x80058AA4
text = "{ void mg_golfer_end(uint8_t*, uint32_t, uint32_t); mg_golfer_end(rdram, (uint32_t)ctx->r2, (uint32_t)ctx->r18); }"

# The ball, the stars around the cup and the sun's lens flare past the 4:3 frame's sides (src/game/ball.cpp): around both
# of the frame's calls of the function that draws the ball's sprites up close (func_ovl0_801FE370), its call of the one
# that draws the stars (func_ovl0_80217164) and the one after it of the one that draws the flare (func_8008D3F4: the
# frame skips it to 0x80030404, where the hook runs either way), and overlay 7's call of the flare, a rectangle at or
# past a side of the screen is put back past it. The end reads the display list's head from the word its caller keeps
# it in: the game's own (0x801B93DC), or overlay 7's copy on its stack ($s0) while it draws.
[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x80030280
text = "{ void mg_ball_begin(uint8_t*); mg_ball_begin(rdram); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x80030288
text = "{ void mg_ball_end(uint8_t*, uint32_t); mg_ball_end(rdram, 0x801B93DC); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x800303D4
text = "{ void mg_ball_begin(uint8_t*); mg_ball_begin(rdram); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x80030404
text = "{ void mg_ball_end(uint8_t*, uint32_t); mg_ball_end(rdram, 0x801B93DC); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x80030750
text = "{ void mg_ball_begin(uint8_t*); mg_ball_begin(rdram); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x80030758
text = "{ void mg_ball_end(uint8_t*, uint32_t); mg_ball_end(rdram, 0x801B93DC); }"

[[patches.hook]]
func = "func_ovl7_801FA4EC"
before_vram = 0x801FA7CC
text = "{ void mg_ball_begin(uint8_t*); mg_ball_begin(rdram); }"

[[patches.hook]]
func = "func_ovl7_801FA4EC"
before_vram = 0x801FA7D4
text = "{ void mg_ball_end(uint8_t*, uint32_t); mg_ball_end(rdram, (uint32_t)ctx->r16); }"

# The iris wipe at its own shape (src/game/iris.cpp): each display list the game sends is read for the mask's
# rectangle, which is drawn at its aspect across the whole window. Then the title and the menus at the picture's full
# height in a wide window (src/game/screen.cpp): on those screens the same list's rectangles, scissors and viewports
# are scaled, all but the iris's, which is why it goes first.
[[patches.hook]]
func = "nuGfxTaskStart"
before_vram = 0x80029774
text = "{ void mg_iris_fix(uint8_t*, uint32_t); void mg_screen_fill(uint8_t*, uint32_t); void mg_border_fill(uint8_t*, uint32_t); mg_iris_fix(rdram, (uint32_t)ctx->r4); mg_border_fill(rdram, (uint32_t)ctx->r4); void mg_dl_log(uint8_t*, uint32_t); mg_dl_log(rdram, (uint32_t)ctx->r4); mg_screen_fill(rdram, (uint32_t)ctx->r4); }"

# The course's terrain without cracks at a high resolution. The course is 8 by 16 blocks, and each frame func_80062A8C
# picks each block's level of detail by its distance: 2, its own fine display list; 1, a 2x2 grid of quads; 0, one quad.
# Where levels meet the game stitches most edges (a fine block's edge pieces suit a coarser neighbour, a level-1 group
# averages its edge midpoints beside a level-0 one), but not all: a level-1 block in a group of four that also holds a
# level-2 one keeps its edges' true midpoints beside a level-0 group above or below it. The terrain bends at those
# midpoints and the level-0 edge doesn't, so a sliver of the background shows between them: on a console a fraction of
# a pixel, at 4K a pale line across the rough wherever a hill's height there is far off the straight edge. Here a block
# the game would draw at level 0 is drawn at level 1 (the branch's delay slot sets 1 in place of 0), so level 0 is
# never drawn and every edge left meets one the game stitches; far terrain draws 8 triangles a block in place of 2.
[[patches.instruction]]
func = "func_80062A8C"
vram = 0x800633A8
value = 0x24050001

# The old shot of a transition over the wide picture's whole width (src/game/card.cpp): before the transition drawer
# (func_800957F0) calls the function that copies its last frame (func_80095150), whether this frame starts a
# transition; around its call of the function that draws that copy as strips (func_8009232C), a copy of the wide frame
# before and the strips rewritten to read it.
[[patches.hook]]
func = "func_800957F0"
before_vram = 0x800957F8
text = "{ void mg_card_check(uint8_t*); mg_card_check(rdram); }"

[[patches.hook]]
func = "func_800957F0"
before_vram = 0x80095870
text = "{ void mg_card_strips_begin(uint8_t*); mg_card_strips_begin(rdram); }"

[[patches.hook]]
func = "func_800957F0"
before_vram = 0x80095878
text = "{ void mg_card_strips_end(uint8_t*); mg_card_strips_end(rdram); }"

# The staff credits' last picture at the picture's full height (src/game/credits.cpp): where the credits' drawing
# (func_ovl16_801F7554) begins the picture's strips, and where it puts back the list's head it keeps at sp + 0x10.
[[patches.hook]]
func = "func_ovl16_801F7554"
before_vram = 0x801F7D9C
text = "{ void mg_credits_picture_begin(uint8_t*, uint32_t); mg_credits_picture_begin(rdram, (uint32_t)ctx->r29); }"

[[patches.hook]]
func = "func_ovl16_801F7554"
before_vram = 0x801F8000
text = "{ void mg_credits_picture_end(uint8_t*, uint32_t); mg_credits_picture_end(rdram, (uint32_t)ctx->r29); }"

# The Game Boy Color's golfers (Kid, Sherry, Azalea and Joe) at character select, with the General tab's Game Boy
# Golfers option (src/game/config.cpp). On a console they come only through a Transfer Pak holding Mario Golf for the
# Game Boy Color: overlay 15's link reads the golfers the cart holds into RAM for the session (0x800FF1E8, 0x8C bytes
# each, never the N64 save), and func_8005CA48 puts each into character select's grid, with its name and its driver's
# stats from the clubs table. The game has the four of its own, names and driver stats in its data (0x800C2B40-
# 0x800C2B60: drives of 500, 400, 300 and 200 yards, test values by the look of them), which func_8005CA48 puts in
# instead while debug flag 0x54 is on (func_800299F4's test), writing those stats over each one's driver. The flag's
# other reader, func_8005C674, sets the grid's every other golfer unlocked, so the flag itself isn't set: after each
# of func_8005CA48's three tests of it, the answer is on unless the option is Original. The first, before anything is
# written, also sets the stats that path writes to the second option's, Game Boy Golfers' Stats: the clubs table's own
# (Normal) or the test values (Test). At its end, the four's clubs are worked out as the link works out a golfer's
# (mg_gb_golfers_clubs), or none of their shots goes anywhere.
[[patches.hook]]
func = "func_8005CA48"
before_vram = 0x8005CBD8
text = "{ int mg_gb_golfers_setup(uint8_t*); if (mg_gb_golfers_setup(rdram)) ctx->r2 = 1; }"

[[patches.hook]]
func = "func_8005CA48"
before_vram = 0x8005CC1C
text = "{ int mg_gb_golfers(void); if (mg_gb_golfers()) ctx->r2 = 1; }"

[[patches.hook]]
func = "func_8005CA48"
before_vram = 0x8005CD18
text = "{ int mg_gb_golfers(void); if (mg_gb_golfers()) ctx->r2 = 1; }"

[[patches.hook]]
func = "func_8005CA48"
before_vram = 0x8005CEBC
text = "{ void mg_gb_golfers_clubs(uint8_t*, recomp_context*); mg_gb_golfers_clubs(rdram, ctx); }"
