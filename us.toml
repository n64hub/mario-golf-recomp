[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x80030950
text = "{ void mg_hud_begin(uint8_t*); mg_hud_begin(rdram); }"

[[patches.hook]]
func = "func_8002DC10"
before_vram = 0x80030958
text = "{ void mg_hud_end(uint8_t*); mg_hud_end(rdram); }"

